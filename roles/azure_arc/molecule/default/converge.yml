---
- name: Converge
  hosts: molecule
  gather_facts: true
  vars:
    # Azure credentials are resolved from environment variables so no plaintext
    # secret is committed to the repository. Set AZURE_CLIENT_ID, AZURE_CLIENT_SECRET,
    # AZURE_TENANT_ID, and AZURE_SUBSCRIPTION_ID in the CI/CD environment or in a
    # local molecule.yml vars_files entry backed by Ansible Vault before running
    # `molecule converge`.
    azure:
      service_principal_id: "{{ lookup('env', 'AZURE_CLIENT_ID') | default('00000000-0000-0000-0000-000000000000') }}"
      service_principal_secret: "{{ lookup('env', 'AZURE_CLIENT_SECRET') | default('') }}"
      tenant_id: "{{ lookup('env', 'AZURE_TENANT_ID') | default('00000000-0000-0000-0000-000000000000') }}"
      subscription_id: "{{ lookup('env', 'AZURE_SUBSCRIPTION_ID') | default('00000000-0000-0000-0000-000000000000') }}"
      resource_group: "molecule-rg"
      location: "eastus"
  tasks:
    - name: Include azure_arc role
      ansible.builtin.include_role:
        name: danmwallace.azure.azure_arc
